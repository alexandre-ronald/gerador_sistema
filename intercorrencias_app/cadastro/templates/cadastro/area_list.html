{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Gerenciamento de Area</h3>
    <a href="{% url 'cadastro:area_create' %}" class="btn btn-primary px-4 shadow-sm">
        <i class="bi bi-plus-lg me-1"></i> Novo Registro
    </a>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card card-summary shadow-sm p-1 border-primary ">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <p class="fw-medium text-muted mb-0">Total de Registros</p>
                        <h2 class="mt-2 ff-secondary cfs-22 fw-semibold text-primary">{{ total_registros }}</h2>

                    </div>
                    <div>
                        <div class="avatar-sm flex-shrink-0">
                            <span class="avatar-title bg-primary-subtle text-primary rounded-circle fs-2">
                                <i class="bi-database"></i>
                            </span>
                        </div>
                    </div>
                </div>
            </div><!-- end card body -->
        </div> <!-- end card-->
    </div>
</div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 border">
                <thead class="bg-light">
                    <tr>
                        
                        <th class="px-4 py-3">Nome</th>
                        
                        <th class="px-4 py-3">Sigla</th>
                        
                        <th class="text-end px-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in objetos %}
                    <tr>
                        
                        <td class="px-4">{{ item.nome }}</td>
                        
                        <td class="px-4">{{ item.sigla }}</td>
                        
                        <td class="text-end px-4">
                            <a href="{% url 'cadastro:area_update' item.pk %}" class="btn btn-light btn-sm text-primary me-1"><i class="bi bi-pencil"></i></a>
                            <a href="{% url 'cadastro:area_delete' item.pk %}" class="btn btn-light btn-sm text-danger"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-5 text-muted">
                            Nenhum registro encontrado. Comece cadastrando um novo!
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
