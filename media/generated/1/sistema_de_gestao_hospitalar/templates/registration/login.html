<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <title>Login | Sistema de Gestão Hospitalar</title>
    <style>
        :root { --primary-color: #0ab39c; }
        
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }

        /* Estrutura Principal */
        .auth-page-wrapper { display: flex; height: 100vh; width: 100vw; }

        /* Lado Esquerdo (Imagem e Overlay) */
        .auth-side-bg {
            flex: 1;
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1551434678-e076c223a692?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .auth-side-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(10, 179, 156, 0.9), rgba(64, 81, 137, 0.9));
            z-index: 1;
        }

        .auth-side-content { position: relative; z-index: 2; color: #fff; text-align: center; max-width: 450px; }
        
        /* Lado Direito (Formulário) */
        .auth-side-form {
            width: 30%;
            background-color: var(--bs-body-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .login-box { width: 100%; max-width: 360px; }

        /* Elementos de UI */
        .btn-primary-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
            padding: 10px;
            font-weight: 600;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-primary-custom:hover { background-color: #099b87; border-color: #099b87; color: #fff; }

        .form-label { font-weight: 500; font-size: 0.85rem; color: var(--bs-secondary-color); }
        .form-control { padding: 10px 15px; border-radius: 6px; background-color: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color); }

        /* Toggle de Tema */
        .theme-toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            border: none;
            background: var(--bs-tertiary-bg);
            color: var(--bs-body-color);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Responsividade */
        @media (max-width: 991.98px) {
            .auth-side-bg { display: none; }
            .auth-side-form { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="auth-page-wrapper">
        
        <div class="auth-side-bg">
            <div class="auth-side-content">
                <div class="mb-4">
                    <i class="bi bi-boxes fs-1"></i>
                </div>
                <h2 class="fw-bold mb-3">Sistema de Gestão Hospitalar</h2>
                <div class="p-4 rounded-3" style="background: rgba(255,255,255,0.1); backdrop-filter: blur(5px);">
                    <i class="bi bi-quote fs-2 text-white-50"></i>
                    <p class="fs-6 fw-light mt-2 italic">"Design limpo, código otimizado e focado na experiência do usuário final."</p>
                </div>
            </div>
        </div>

        <div class="auth-side-form shadow-lg">
            
            <button id="theme-toggle" class="theme-toggle-btn">
                <i class="bi bi-moon-fill" id="theme-icon"></i>
            </button>

            <div class="login-box">
                <div class="text-center mb-5">
                    <h4 class="fw-bold text-body">Bem-vindo de volta!</h4>
                    <p class="text-muted small">Faça login para continuar no Sistema.</p>
                </div>

                

                <form method="post" autocomplete="off">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" placeholder="Insira seu usuário" required autofocus>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label">Senha</label>
                            <a href="#" class="text-muted small text-decoration-none">Esqueceu?</a>
                        </div>
                        <input type="password" name="password" class="form-control" placeholder="Insira sua senha" required>
                    </div>

                    <div class="form-check mb-4 small">
                        <input class="form-check-input" type="checkbox" id="remember-me">
                        <label class="form-check-label text-muted" for="remember-me">Lembrar-me</label>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mb-4 shadow-sm">
                        Entrar
                    </button>

                    <div class="text-center">
                        <p class="text-muted small mb-0">Não tem uma conta? <a href="#" class="text-primary fw-semibold text-decoration-none">Cadastre-se</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');
        const html = document.documentElement;

        function setTheme(theme) {
            html.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        btn.addEventListener('click', () => {
            const current = html.getAttribute('data-bs-theme');
            setTheme(current === 'light' ? 'dark' : 'light');
        });
    </script>
</body>
</html>
