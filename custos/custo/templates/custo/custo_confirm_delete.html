{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 text-center p-4">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
            </div>
            <h4 class="fw-bold">Confirmar Exclusão</h4>
            <p class="text-muted">Tem certeza que deseja remover este registro de <strong>Custo</strong>? Esta ação não pode ser desfeita.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-2 d-md-block mt-4">
                    <button type="submit" class="btn btn-danger px-5 me-md-2">Sim, Excluir</button>
                    <a href="{% url 'custo:custo_list' %}" class="btn btn-light px-5">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
