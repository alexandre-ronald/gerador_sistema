<style>
.df-page-header{border:1px solid var(--bs-border-color);border-radius:20px;padding:1.4rem 1.5rem;background:linear-gradient(135deg,var(--bs-primary-bg-subtle),var(--bs-body-bg));box-shadow:0 7px 28px rgba(0,0,0,.04)}
.df-page-header .df-eyebrow{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--bs-primary)}
.df-page-header .df-title{font-weight:800;letter-spacing:-.02em;margin:0}.df-page-header .df-subtitle{color:var(--bs-secondary-color);margin:.35rem 0 0}.df-page-back{white-space:nowrap}
</style>
<div class="df-page-header d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
  <div>
    {% if eyebrow %}<div class="df-eyebrow mb-1">{{ eyebrow }}</div>{% endif %}
    <h1 class="h3 df-title">{{ title }}</h1>
    {% if subtitle %}<p class="df-subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  <div class="d-flex flex-wrap gap-2 align-items-center">
    {% if secondary_url and secondary_label %}<a href="{{ secondary_url }}" class="btn btn-outline-primary">{{ secondary_label }}</a>{% endif %}
    {% if back_url %}<a href="{{ back_url }}" class="btn btn-outline-secondary df-page-back"><i class="bi bi-arrow-left me-1"></i>{{ back_label|default:'Voltar' }}</a>{% endif %}
  </div>
</div>
