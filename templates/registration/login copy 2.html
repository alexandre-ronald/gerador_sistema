<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Gerador de Sistemas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc, #e0e7ff, #c7d2fe);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            width: 1080px;
            max-width: 95%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .left-panel {
            padding: 70px 65px;
            background: white;
        }

        .right-panel {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            padding: 70px 65px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #4338ca;
            letter-spacing: -0.5px;
        }

        .login-icon {
            width: 88px;
            height: 88px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 45px auto 35px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .form-control {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 1.02rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .input-group-text {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-right: none;
            color: #64748b;
            border-radius: 16px 0 0 16px;
        }

        .btn-login {
            background: linear-gradient(90deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-weight: 600;
            font-size: 1.05rem;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.35);
        }

        .welcome-title {
            font-size: 2.85rem;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 24px;
        }

        .welcome-text {
            font-size: 1.15rem;
            opacity: 0.92;
            line-height: 1.55;
        }

        .link-signup {
            color: white;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row g-0">
            <!-- Painel Esquerdo - Login -->
            <div class="col-lg-5 left-panel">

                <div class="login-icon">
                    <i class="bi bi-person-circle" style="font-size: 46px; color: #6366f1;"></i>
                </div>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Nome de usuário" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100">Entrar no sistema</button>

                    <div class="d-flex justify-content-between align-items-center mt-4 small text-muted">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Lembrar-me</label>
                        </div>
                        <a href="{% url 'password_reset' %}" class="text-decoration-none" style="color: #6366f1;">
                            Esqueci a senha
                        </a>
                    </div>
                </form>
            </div>

            <!-- Painel Direito - Apresentação -->
            <div class="col-lg-7 right-panel">
                <h1 class="welcome-title">
                    &lt;/&gt; Gerador
                </h1>
                <p class="welcome-text">
                    Crie aplicações Django completas, bonitas e profissionais em poucos minutos, 
                    apenas a partir dos seus modelos de dados.
                </p>
                
                <div class="mt-5">
                    <p class="mb-1">Ainda não tem conta?</p>
                    <a href="#" class="link-signup fs-5 text-decoration-none">
                        Cadastre-se agora <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
