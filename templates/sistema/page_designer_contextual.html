{% extends 'sistema/page_designer.html' %}
{% block content %}
{{ block.super }}
<script>
(function(){
  const previewBase = "{% url 'sistema:application_preview' sistema.pk %}";

  function selectedPageId(){
    const urlId = new URL(window.location.href).searchParams.get('pagina');
    if(urlId) return urlId;
    const active = document.querySelector('.page-item.active');
    return active ? active.dataset.id : '';
  }

  function selectedPage(){
    const pageId = selectedPageId();
    if(!pageId || typeof state === 'undefined') return null;
    return (state.config.pages || []).find(page => page.id === pageId) || null;
  }

  function ensureRecordNavigationHint(){
    const toggle = document.getElementById('navVisible');
    if(!toggle) return null;
    let hint = document.getElementById('recordNavigationHint');
    if(!hint){
      hint = document.createElement('div');
      hint.id = 'recordNavigationHint';
      hint.className = 'page-meta mt-1 d-none';
      hint.textContent = 'Páginas de registro são acessadas a partir de uma listagem, ação ou outra página e não aparecem diretamente no menu.';
      const host = toggle.closest('.col-md-4') || toggle.parentElement;
      if(host) host.appendChild(hint);
    }
    return hint;
  }

  function syncRecordNavigationRule(){
    const toggle = document.getElementById('navVisible');
    const hint = ensureRecordNavigationHint();
    if(!toggle) return;
    const page = selectedPage();
    const isRecord = !!(page && page.context && page.context.kind === 'record');
    toggle.disabled = isRecord;
    if(hint) hint.classList.toggle('d-none', !isRecord);
    if(isRecord && page.navigation && page.navigation.visible){
      page.navigation.visible = false;
      toggle.checked = false;
      if(typeof dirty === 'function') dirty();
    }
  }

  function syncSelection(pageId){
    if(!pageId) return;
    const designerUrl = new URL(window.location.href);
    designerUrl.searchParams.set('pagina', pageId);
    window.history.replaceState({}, '', designerUrl.pathname + designerUrl.search + designerUrl.hash);

    const previewLink = Array.from(document.querySelectorAll('.toolbar-actions a'))
      .find(a => (a.textContent || '').trim().includes('Ver Preview'));
    if(previewLink){
      const previewUrl = new URL(previewBase, window.location.origin);
      previewUrl.searchParams.set('pagina', 'advanced');
      previewUrl.searchParams.set('pagina_avancada', pageId);
      previewLink.href = previewUrl.pathname + previewUrl.search;
    }
    requestAnimationFrame(syncRecordNavigationRule);
  }

  document.addEventListener('click', function(event){
    const item = event.target.closest('.page-item');
    if(item && item.dataset.id){
      syncSelection(item.dataset.id);
      return;
    }

    const previewLink = event.target.closest('.toolbar-actions a');
    if(previewLink && (previewLink.textContent || '').trim().includes('Ver Preview')){
      const pageId = selectedPageId();
      if(pageId) syncSelection(pageId);
    }
  });

  document.addEventListener('change', function(event){
    if(event.target && event.target.id === 'contextKind'){
      const page = selectedPage();
      if(page && page.context) page.context.kind = event.target.value;
      requestAnimationFrame(syncRecordNavigationRule);
    }
  });

  requestAnimationFrame(function(){
    const pageId = selectedPageId() || document.querySelector('.page-item')?.dataset.id || '';
    if(pageId) syncSelection(pageId);
    syncRecordNavigationRule();
  });
})();
</script>
{% endblock %}
