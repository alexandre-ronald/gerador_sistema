{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white p-4 border-0">
                <h4 class="fw-bold mb-0">
                    {% if object %}Editar{% else %}Cadastrar{% endif %} Area
                </h4>
            </div>
            <div class="card-body p-4 pt-0">
                <form method="post" class="needs-validation">
                    {% csrf_token %}
                    
                    <div class="row g-3">
                        {{ form.as_p }}
                    </div>

                    <div class="mt-4 border-top pt-4">
                        <button type="submit" class="btn btn-primary px-4 me-2">Salvar Registro</button>
                        <a href="{% url 'cadastro:area_list' %}" class="btn btn-light px-4">Voltar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
