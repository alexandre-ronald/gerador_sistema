{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">Gerenciamento de Cargos</h3>
    <a href="{% url 'cadastros:cargos_create' %}" class="btn btn-primary px-4 shadow-sm">
        <i class="bi bi-plus-lg me-1"></i> Novo Registro
    </a>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card card-summary shadow-sm bg-white p-3">
            <div class="d-flex align-items-center">
                <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3">
                    <i class="bi bi-database text-primary fs-4"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-0">Total de Registros</h6>
                    <h4 class="fw-bold mb-0">{{ total_registros }}</h4>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        
                        <th class="px-4 py-3">Cargo</th>
                        
                        <th class="text-end px-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in objetos %}
                    <tr>
                        
                        <td class="px-4">{{ item.cargo }}</td>
                        
                        <td class="text-end px-4">
                            <a href="{% url 'cadastros:cargos_update' item.pk %}" class="btn btn-light btn-sm text-primary me-1"><i class="bi bi-pencil"></i></a>
                            <a href="{% url 'cadastros:cargos_delete' item.pk %}" class="btn btn-light btn-sm text-danger"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center py-5 text-muted">
                            Nenhum registro encontrado. Comece cadastrando um novo!
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
