{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Sistemas - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-blue: #4c6ef5;
            --dark-blue: #1a233a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a233a 0%, #2a3552 100%);
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-container {
            height: 100vh;
            display: flex;
        }

        /* Lado esquerdo - Ilustração com robô */
        .left-side {
            flex: 1;
            background: linear-gradient(135deg, #1e2a4a, #2c3e6e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .left-side::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(76,110,245,0.15), transparent 70%);
        }

        .robot-container {
            text-align: center;
            z-index: 2;
        }

        .robot-img {
            width: 280px;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .left-text {
            color: white;
            margin-top: 30px;
        }

        .left-text h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .left-text p {
            font-size: 16px;
            opacity: 0.85;
            max-width: 280px;
            margin: 0 auto;
        }

        /* Lado direito - Formulário */
        .right-side {
            flex: 1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 700;
            color: var(--dark-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-label {
            font-weight: 500;
            color: #374151;
            font-size: 14.5px;
        }

        .form-control {
            border-radius: 12px;
            padding: 14px 18px;
            border: 2px solid #e5e7eb;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(76, 110, 245, 0.12);
            outline: none;
        }

        .btn-login {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background: #3b5be0;
            transform: translateY(-2px);
        }

        .forgot {
            color: var(--accent-blue);
            font-size: 14px;
            text-decoration: none;
        }

        .input-group-text {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-right: none;
            color: #64748b;
            border-radius: 16px 0 0 16px;
        }

        .forgot:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <!-- Lado Esquerdo com o Robô -->
        <div class="left-side">
            <div class="robot-container">
                <img src="{% static 'images/robot.png' %}" class="robot-img" 
                     alt="Robô ">
                <div class="left-text">
                    <h1>Gerador de Sistemas</h1>
                    <p>Inteligência artificial ajudando a gerenciar seu negócio com simplicidade.</p>
                </div>
            </div>
        </div>

        <!-- Lado Direito - Formulário -->
        <div class="right-side">
            <div class="login-card">
                <div class="brand">
                    <div class="brand-logo">
                        <i class="bi bi-robot"></i>
                        Gerador de Sistemas
                    </div>
                </div>

                
                <p class="text-center text-muted mb-4">Faça login para acessar o dashboard</p>

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Nome de usuário" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Senha" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label text-muted" for="remember">Lembrar de mim</label>
                        </div>
                        <a href="#" class="forgot">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn btn-login">
                        Entrar no Sistema
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted mb-2" style="font-size: 14px;">
                        Ainda não tem acesso?
                    </p>
                    <a href="#" class="fw-medium" style="color: var(--accent-blue); text-decoration: none;">
                        Solicitar acesso ao administrador
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
