{% if preview.advanced_page %}
<style>
.preview-advanced-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:minmax(72px,auto);gap:12px}.preview-advanced-block{min-width:0}.preview-advanced-card{height:100%;border:1px solid var(--preview-border);border-radius:14px;background:var(--preview-surface);overflow:hidden}.preview-advanced-body{padding:14px}.preview-advanced-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--preview-muted);margin-bottom:5px}.preview-advanced-value{font-size:.9rem;font-weight:700}.preview-advanced-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.preview-advanced-detail-item{padding:12px 14px;border-bottom:1px solid var(--preview-border)}.preview-advanced-detail-item:nth-child(odd){border-right:1px solid var(--preview-border)}.preview-advanced-action{height:100%;display:flex;align-items:center}.preview-advanced-button{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--preview-primary);background:var(--preview-primary);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:.74rem;font-weight:800}.preview-advanced-button.secondary{background:var(--preview-surface);color:var(--preview-primary)}.preview-advanced-disabled{opacity:.46;filter:saturate(.4)}.preview-advanced-special{display:flex;align-items:center;justify-content:space-between;gap:12px;height:100%}.preview-advanced-icon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--preview-primary) 11%,transparent);color:var(--preview-primary);flex:none}.preview-advanced-form-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.preview-advanced-form-field{border:1px solid var(--preview-border);border-radius:9px;padding:9px 10px;background:var(--preview-soft)}.preview-advanced-note{font-size:.68rem;color:var(--preview-muted)}@media(max-width:991.98px){.preview-advanced-grid{display:block}.preview-advanced-block{margin-bottom:12px}.preview-advanced-detail,.preview-advanced-form-fields{grid-template-columns:1fr}.preview-advanced-detail-item:nth-child(odd){border-right:0}}
</style>
<template id="preview-advanced-page-template">
  {% if preview.interface.breadcrumb %}<div class="preview-breadcrumb"><i class="bi bi-house-door me-1"></i>Início <i class="bi bi-chevron-right mx-1"></i>Páginas <i class="bi bi-chevron-right mx-1"></i>{{ preview.advanced_page.name }}</div>{% endif %}
  <div class="preview-heading"><h3>{{ preview.advanced_page.name }}</h3><p>{{ preview.content.subtitle }}</p></div>
  {% if not preview.advanced_page.allowed %}
  <div class="preview-placeholder" data-preview-advanced-denied><div class="preview-placeholder-icon"><i class="bi bi-shield-lock"></i></div><div class="preview-placeholder-title">Página não disponível para este papel</div><div class="preview-placeholder-copy">O contexto da página exige uma capacidade que o Permission Designer não concedeu ao papel simulado.</div></div>
  {% else %}
  <div class="preview-demo-note rounded mb-3"><i class="bi bi-stars me-1"></i>Dados e valores são demonstrativos. Layout, componentes, bindings e ações vêm do Advanced Page Designer.</div>
  <section class="preview-advanced-grid" data-preview-page="advanced" data-advanced-page-id="{{ preview.advanced_page.id }}">
    {% for component in preview.advanced_page.components_projection %}
    <article class="preview-advanced-block {% if not component.allowed %}preview-advanced-disabled{% endif %}" style="grid-column:{{ component.layout.x|add:1 }} / span {{ component.layout.w }};grid-row:{{ component.layout.y|add:1 }} / span {{ component.layout.h }}" data-advanced-component="{{ component.id }}" data-component-type="{{ component.type }}">
      {% if component.type == 'title' %}<div class="preview-advanced-card"><div class="preview-advanced-body"><h4 class="mb-0 fw-bold">{{ component.title|default:preview.advanced_page.name }}</h4></div></div>
      {% elif component.type == 'text' %}<div class="preview-advanced-card"><div class="preview-advanced-body"><div class="preview-advanced-note">{{ component.config.text|default:component.title }}</div></div></div>
      {% elif component.type == 'alert' %}<div class="alert alert-info h-100 mb-0 d-flex align-items-center small"><i class="bi bi-info-circle me-2"></i>{{ component.config.text|default:component.title }}</div>
      {% elif component.type == 'separator' %}<hr class="my-3">
      {% elif component.type == 'metric' or component.type == 'field_summary' %}<div class="preview-advanced-card"><div class="preview-advanced-body"><div class="preview-advanced-label">{{ component.title|default:component.binding.field }}</div><div class="preview-advanced-value">{{ component.demo_value|default:'Não informado' }}</div></div></div>
      {% elif component.type == 'record_detail' %}<div class="preview-advanced-card"><div class="preview-advanced-body border-bottom"><div class="fw-bold small">{{ component.title|default:'Detalhes do registro' }}</div></div><div class="preview-advanced-detail">{% for field in component.fields %}<div class="preview-advanced-detail-item"><div class="preview-advanced-label">{{ field.label }}</div><div class="preview-advanced-value">{{ field.demo_value }}</div></div>{% endfor %}</div></div>
      {% elif component.type == 'table' %}<div class="preview-advanced-card"><div class="preview-advanced-body border-bottom"><div class="fw-bold small">{{ component.title|default:'Registros' }}</div></div><div class="preview-table-wrap"><table class="preview-table"><thead><tr>{% for field in component.fields %}<th>{{ field.label }}</th>{% endfor %}</tr></thead><tbody>{% for row in component.demo_rows %}<tr>{% for cell in row.values %}<td>{{ cell.value }}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div></div>
      {% elif component.type == 'form' %}<div class="preview-advanced-card"><div class="preview-advanced-body border-bottom"><div class="fw-bold small">{{ component.title|default:'Formulário' }}</div><div class="preview-advanced-note">{{ component.special.operation|title }} · Form Designer</div></div><div class="preview-advanced-body"><div class="preview-advanced-form-fields">{% for section in component.form_sections %}{% for field in section.fields %}<div class="preview-advanced-form-field"><div class="preview-advanced-label">{{ field.label }}</div><div class="preview-advanced-note">{{ field.placeholder|default:'Campo do formulário' }}</div></div>{% endfor %}{% endfor %}</div></div></div>
      {% elif component.type == 'report' %}<div class="preview-advanced-card"><div class="preview-advanced-body preview-advanced-special"><div class="d-flex gap-3 align-items-start"><div class="preview-advanced-icon"><i class="bi bi-file-earmark-bar-graph"></i></div><div><div class="preview-advanced-label">Relatório</div><div class="fw-bold small">{{ component.title|default:'Relatório integrado' }}</div><div class="preview-advanced-note">{{ component.binding.ref }} · {{ component.special.report_id }}</div></div></div><span class="badge bg-primary-subtle text-primary-emphasis">Report Designer</span></div></div>
      {% elif component.type == 'dashboard' %}<div class="preview-advanced-card"><div class="preview-advanced-body preview-advanced-special"><div class="d-flex gap-3 align-items-start"><div class="preview-advanced-icon"><i class="bi bi-grid-1x2"></i></div><div><div class="preview-advanced-label">Dashboard</div><div class="fw-bold small">{{ component.title|default:component.special.title }}</div><div class="preview-advanced-note">{{ component.special.widget_count }} widget(s) configurado(s)</div></div></div><span class="badge bg-primary-subtle text-primary-emphasis">Dashboard Designer</span></div></div>
      {% elif component.type == 'button' or component.type == 'link' or component.type == 'workflow_action' %}<div class="preview-advanced-action"><span class="preview-advanced-button {% if component.type == 'link' %}secondary{% endif %}">{% if component.type == 'workflow_action' %}<i class="bi bi-arrow-repeat"></i>{% elif component.type == 'link' %}<i class="bi bi-box-arrow-up-right"></i>{% else %}<i class="bi bi-lightning-charge"></i>{% endif %}{{ component.action_projection.label|default:component.title|default:'Ação' }}</span></div>
      {% else %}<div class="preview-advanced-card"><div class="preview-advanced-body"><div class="preview-advanced-label">{{ component.type }}</div><div class="fw-bold small">{{ component.title|default:'Componente' }}</div></div></div>{% endif %}
      {% if not component.allowed %}<div class="preview-advanced-note mt-1"><i class="bi bi-shield-lock me-1"></i>Oculto no runtime para o papel simulado.</div>{% endif %}
    </article>
    {% empty %}<div class="preview-placeholder" style="grid-column:1/-1"><div class="preview-placeholder-icon"><i class="bi bi-window-stack"></i></div><div class="preview-placeholder-title">Página sem componentes</div></div>{% endfor %}
  </section>
  {% endif %}
</template>
<div id="preview-advanced-navigation-data" class="d-none">
  {% for item in preview.advanced_pages %}<span data-page-id="{{ item.id }}" data-label="{{ item.label }}" data-icon="{{ item.icon }}" data-group="{{ item.group }}" data-active="{% if item.active %}1{% else %}0{% endif %}"></span>{% endfor %}
</div>
<script>
(function(){
  const tpl=document.getElementById('preview-advanced-page-template');
  const container=document.querySelector('[data-preview-device-container]');
  if(!tpl||!container)return;
  const content=container.querySelector('.preview-content');
  if(content)content.replaceChildren(tpl.content.cloneNode(true));
  const params=new URLSearchParams(window.location.search);const role=params.get('papel');const device=params.get('dispositivo');
  const preserved=['papel','dispositivo','entidade','estado','relatorio'];
  const data=[...document.querySelectorAll('#preview-advanced-navigation-data [data-page-id]')];
  const makeHref=id=>{const q=new URLSearchParams();q.set('pagina','advanced');q.set('pagina_avancada',id);preserved.forEach(key=>{const value=params.get(key);if(value)q.set(key,value)});return '?'+q.toString();};
  const side=container.querySelector('.preview-nav');
  if(side&&data.length){const label=document.createElement('div');label.className='preview-nav-label';label.textContent='Páginas';side.appendChild(label);data.forEach(item=>{const a=document.createElement('a');a.href=makeHref(item.dataset.pageId);a.className='preview-nav-item'+(item.dataset.active==='1'?' active':'');a.dataset.advancedPageLink=item.dataset.pageId;a.innerHTML='<i class="bi '+(item.dataset.icon||'bi-window')+'"></i><span></span>';a.querySelector('span').textContent=item.dataset.label;side.appendChild(a);});}
  const top=container.querySelector('.preview-navbar-links');
  if(top&&data.length){data.forEach(item=>{const a=document.createElement('a');a.href=makeHref(item.dataset.pageId);a.className='preview-navbar-link'+(item.dataset.active==='1'?' active':'');a.dataset.advancedPageLink=item.dataset.pageId;a.textContent=item.dataset.label;top.appendChild(a);});}
})();
</script>
{% endif %}
