<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1f2937, #3f5efb);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-container {
            width: 1200px;
            max-width: 95%;
            background: #1c1740;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .left-panel {
            background: #1c1740;
            padding: 60px;
            color: white;
        }

        .right-panel {
            background: #1c1740;
            padding: 60px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .divider {
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .logo {
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .login-icon {
            font-size: 70px;
            color: #1bc0ff;
            margin-bottom: 30px;
        }

        .form-control {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            color: white;
            padding: 10px 20px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-control:focus {
            background: transparent;
            color: white;
            box-shadow: none;
            border-color: #ff3cac;
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: white;
        }

        .btn-login {
            background: linear-gradient(90deg, #1383af, #1383af);
            border: none;
            border-radius: 30px;
            padding: 10px;
            font-weight: 500;
            margin-top: 20px;
        }

        .btn-login:hover {
            opacity: .9;
        }

        .welcome-title {
            font-size: 48px;
            font-weight: 700;
        }

        .welcome-text {
            color: rgba(255, 255, 255, 0.6);
            max-width: 350px;
        }

        .top-menu {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            color: white;
            font-size: 14px;
        }
    </style>

</head>

<body>

    

    <div class="login-container">

        <div class="row g-0">

            <!-- LOGIN -->

            <div class="col-lg-5 left-panel">

                <div class="logo">
                    <i class="bi bi-code-slash"></i> GERADOR DE SISTEMAS
                </div>

                <div class="login-icon text-center">
                    <i class="bi bi-person-circle"></i>
                </div>

                <form method="post" action="{% url 'login' %}">

                    {% csrf_token %}

                    <div class="mb-3">

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input type="text" name="username" class="form-control" placeholder="Username">

                        </div>

                    </div>


                    <div class="mb-3">

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input type="password" name="password" class="form-control" placeholder="Password">

                        </div>

                    </div>


                    <button class="btn btn-login w-100">
                        LOGIN
                    </button>


                    <div class="d-flex justify-content-between mt-3 small text-light">

                        <div>
                            <input type="checkbox"> Lembrar usuário
                        </div>

                        <a href="{% url 'password_reset' %}" class="text-light text-decoration-none">
                            Recuperar Senha
                        </a>

                    </div>

                </form>

            </div>


            <div class="col-lg-1 d-none d-lg-block divider"></div>


            <div class="col-lg-6 right-panel">

                <h1 class="welcome-title">
                    <i class="bi bi-code-slash"></i> Gerador
                </h1>

                <p class="welcome-text mt-3">

                    Crie aplicações Django completas a partir de modelos de dados.

                </p>

                <p class="mt-4">
                    Not a member? <strong>Sign up now</strong>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
