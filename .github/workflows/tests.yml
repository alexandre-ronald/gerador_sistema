name: Tests

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches:
      - master
      - 'agent/**'

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Django
        run: python -m pip install --upgrade pip Django==6.0.3

      - name: Django system check
        run: python manage.py check

      - name: Migration check
        run: python manage.py makemigrations --check

      - name: Test suite
        run: python manage.py test
